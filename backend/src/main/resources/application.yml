# Default configuration for local development
spring:
  application:
    name: nfl-agentic-backend
  
  datasource:
    url: jdbc:postgresql://localhost:5432/nfl_predictor
    username: nfl_user
    password: nfl_password
    driver-class-name: org.postgresql.Driver
    
  # Flyway owns the schema now; see db/migration. baseline-on-migrate lets it
  # adopt the existing database, which ddl-auto created before migrations
  # existed: a non-empty schema is stamped at V1 and starts applying from V2.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      # `none`, not `validate`. Flyway is the source of truth for schema, and
      # Hibernate must not mutate it. Validation is deliberately left off for
      # now because `teams` predates all of this - database/init.sql creates it
      # with fixed integer ids while the entity declares IDENTITY, and that
      # mismatch would fail startup on a table unrelated to any of this. Worth
      # tightening to `validate` once teams is reconciled.
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        
  # WebClient configuration
  webflux:
    base-path: /api

  # In-memory caching locally so the service runs without a Redis container.
  # The docker profile below switches this to Redis.
  cache:
    type: simple

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000
    
server:
  port: 8080

# Agent Service Configuration
agent:
  service:
    url: http://localhost:8001
    timeout: 30000  # 30 seconds
    retry:
      max-attempts: 3
      delay: 1000   # 1 second between retries
    endpoints:
      predict: /predict
      status: /agents/status
      health: /health
      refresh: /agents/refresh

# External APIs (for future use)
external-apis:
  espn:
    base-url: https://site.api.espn.com/apis/site/v2/sports/football/nfl
    timeout: 10000
  weather:
    api-key: ${WEATHER_API_KEY:dummy-key}
    base-url: https://api.openweathermap.org/data/2.5
    timeout: 5000

# Prediction Configuration
prediction:
  cache:
    enabled: true
    ttl: 300                # 5 minutes cache TTL
    game-ttl-minutes: 30    # Agent output drifts as lines and injuries move
    weight-ttl-hours: 24    # Weights only change on recalibration
  confidence:
    minimum: 0.5
    maximum: 0.95
  reasoning:
    max-length: 500
  consensus:
    # Weight applied to an agent with no calibrated entry. Deliberately small:
    # a new agent should earn influence in the backtest before it can swing a
    # prediction.
    default-weight: 0.02
  fanout:
    # Fanning out across a week's games. These tasks block on the agent
    # service, so the pool is sized above the core count.
    core-pool-size: 8
    max-pool-size: 16
    queue-capacity: 64
  settlement:
    # Scores stored predictions against final results. Tuesday 09:00 is late
    # enough that Monday night is final and ESPN has settled the box scores.
    enabled: true
    cron: "0 0 9 * * TUE"
    # The refresh re-pulls 18 weeks from ESPN with a 1s courtesy delay between
    # them, so this needs a far longer timeout than a normal request.
    refresh-timeout-ms: 120000

# Logging Configuration
logging:
  level:
    com.nflpredict: INFO
    org.springframework.web: INFO
    org.springframework.web.reactive.function.client: DEBUG  # WebClient debugging
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Management endpoints (for monitoring)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  info:
    app:
      name: ${spring.application.name}
      version: 1.0.0
      description: NFL Agentic Predictor Backend

---
# Docker-specific configuration
spring:
  config:
    activate:
      on-profile: docker
      
  # Docker database connection
  datasource:
    url: jdbc:postgresql://postgres:5432/nfl_predictor

  cache:
    type: redis

  data:
    redis:
      host: redis
      port: 6379
    
# Docker agent service connection
agent:
  service:
    url: http://agent-service:8001  # Docker internal network

# Docker logging (less verbose)
logging:
  level:
    com.nflpredict: INFO
    org.springframework.web.reactive.function.client: WARN

---
# Production configuration
spring:
  config:
    activate:
      on-profile: production
      
  # Production database settings
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      
  jpa:
    show-sql: false  # Don't log SQL in production
    hibernate:
      ddl-auto: none  # Gateway tables are created by Flyway migrations

  cache:
    type: redis

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      
# Production agent service (load balanced)
agent:
  service:
    url: ${AGENT_SERVICE_URL:http://agent-service:8001}
    timeout: 15000  # Shorter timeout in production
    retry:
      max-attempts: 2  # Fewer retries in production

# Production logging
logging:
  level:
    com.nflpredict: WARN
    org.springframework.web.reactive.function.client: ERROR
  file:
    name: /app/logs/nfl-backend.log
    max-size: 100MB
    max-history: 30

---
# Test configuration
spring:
  config:
    activate:
      on-profile: test
      
  # Test database (H2 in-memory)
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    
  h2:
    console:
      enabled: true

  cache:
    type: simple

# Test agent service (mock)
agent:
  service:
    url: http://localhost:8001
    timeout: 5000
    
# Test logging
logging:
  level:
    com.nflpredict: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
---
# Railway deployment
#
# Railway injects PORT, and its Postgres/Redis plugins inject PG*/REDIS*
# variables. Reference those directly rather than a hardcoded host, so the
# service works with whatever instances the project is wired to.
spring:
  config:
    activate:
      on-profile: railway

  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Railway's starter Postgres caps connections well below the default 10
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      # agent_weights and predictions are created and migrated by Flyway
      ddl-auto: none
    show-sql: false

  # Redis is optional. Set SPRING_CACHE_TYPE=simple to run on an in-memory
  # cache and skip the service entirely.
  cache:
    type: ${SPRING_CACHE_TYPE:redis}

  # No spring.data.redis block on purpose.
  #
  # A placeholder like ${REDISPORT:6379} only falls back when the variable is
  # *absent*. Railway hands out an empty string for a reference to a service
  # that does not exist, and an empty value binds as null - which fails against
  # the primitive int and takes the application down at startup. That happens
  # even with Redis disabled, because spring-boot-starter-data-redis is on the
  # classpath and these properties bind whatever the cache type is.
  #
  # Leaving the block out means Spring Boot's own defaults apply and there is no
  # placeholder left to fail. To point at a real Redis, set Spring's canonical
  # names, which bind directly with no indirection:
  #
  #   SPRING_DATA_REDIS_HOST     = ${{Redis.REDISHOST}}
  #   SPRING_DATA_REDIS_PORT     = ${{Redis.REDISPORT}}
  #   SPRING_DATA_REDIS_PASSWORD = ${{Redis.REDISPASSWORD}}

server:
  port: ${PORT:8080}

agent:
  service:
    # Set to the Railway-internal URL of the Python service, e.g.
    # http://nfl-predictor-system.railway.internal:8001
    url: ${AGENT_SERVICE_URL}
    timeout: 20000
    retry:
      max-attempts: 2

prediction:
  settlement:
    enabled: true
    cron: "0 0 9 * * TUE"

logging:
  level:
    com.nflpredict: INFO
    org.springframework.web.reactive.function.client: WARN
