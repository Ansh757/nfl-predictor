# Keeps the hosted prediction service from going to sleep.
#
# Railway stops the container after a spell with no inbound traffic, and the
# next visitor pays the boot - measured at roughly 90 seconds on a first load.
# Nothing inside the container can prevent that: only inbound requests count as
# activity, so the ping has to come from outside. This is that ping.
#
# The frontend still handles a cold start gracefully (WakeBanner, retrying
# health probe) - this reduces how often anyone sees it, it does not replace it.
#
# Set the repository variable KEEP_WARM_URL to point at a different deployment.
name: Keep service warm

on:
  schedule:
    # Every 10 minutes. GitHub delays scheduled runs under load, so treat this
    # as "roughly every 10-20 minutes" rather than a guarantee.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          KEEP_WARM_URL: ${{ vars.KEEP_WARM_URL || 'https://nfl-predictor-system-production.up.railway.app' }}
        run: |
          # --max-time is generous on purpose: if the service *is* asleep, this
          # request is the one that wakes it and it will not answer quickly.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 \
                   "${KEEP_WARM_URL%/}/health")
          echo "GET ${KEEP_WARM_URL%/}/health -> $code"
          # A ping that fails is not worth failing the repo's checks over; it
          # means one visitor may hit a cold start, not that anything is broken.
          [ "$code" = "200" ] || echo "::warning::Health check returned $code"
